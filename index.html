<!-- 🚀 [INÍCIO: PWA - BOOT SEM FLASH (TEMA ANTES DO CSS E WATCHDOG)] -->
    <script>
        // Resolve o tema antes do CSS carregar para evitar flash visual no primeiro paint.
        (() => {
            let savedTheme = null;
            try { savedTheme = localStorage.getItem('notas-pwa-theme'); } catch (_) { /* storage opcional */ }
            const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.dataset.theme = ['light', 'dark'].includes(savedTheme) ? savedTheme : systemTheme;
            // Barra de status já correta no primeiro paint (valores iguais ao token
            // --app-status-bar definido no styles.css: claro #F8FAFC, escuro #11161D).
            const metaTema = document.querySelector('meta[name="theme-color"]');
            if (metaTema) metaTema.setAttribute('content', document.documentElement.dataset.theme === 'dark' ? '#11161D' : '#F8FAFC');
        })();
    </script>
</head>
<body class="bg-bg-global text-text-main min-h-screen overflow-x-hidden leading-relaxed select-none font-sans">
    <!-- Auto-recuperação: aparece só se o app não iniciar (cache/Service Worker antigo).
         O botão limpa Service Worker e cache — NÃO apaga as notas (LocalStorage). -->
    <div id="bootGuard" class="app-boot-guard" hidden role="alert" aria-live="assertive">
        <p class="app-boot-guard-titulo"><strong>O aplicativo não iniciou.</strong></p>
        <p id="bootGuardErro" class="app-boot-guard-erro"></p>
        <button type="button" id="bootGuardReparar">Reparar e recarregar</button>
        <p class="app-boot-guard-obs">Isso atualiza o cache do app e <strong>não apaga suas notas</strong>.</p>
    </div>
    <script>
        /* Watchdog de inicialização: se o app não ficar pronto em 6 s (ou der erro),
           mostra o aviso acima. Roda inline, então funciona mesmo se o app.js não carregar. */
        (function () {
            var guard = document.getElementById('bootGuard');
            var detalhe = document.getElementById('bootGuardErro');
            var erros = [];
            function mostrar() {
                if (!guard || !guard.hidden || window.__notasPronto) return;
                if (detalhe) detalhe.textContent = erros.length ? erros.slice(0, 3).join('\n') : 'Tempo de carregamento excedido.';
                guard.hidden = false;
            }
            window.addEventListener('error', function (e) {
                erros.push((e.message || 'Erro ao carregar recurso') + (e.filename ? ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')' : ''));
                mostrar();
            }, true); // captura: pega também erros de carregamento de scripts/css
            window.addEventListener('unhandledrejection', function (e) {
                erros.push('Promessa: ' + ((e.reason && e.reason.message) || e.reason || 'erro'));
            });
            window.setTimeout(mostrar, 6000);
            var botao = document.getElementById('bootGuardReparar');
            if (botao) botao.addEventListener('click', async function () {
                botao.disabled = true;
                botao.textContent = 'Reparando…';
                try {
                    if (navigator.serviceWorker) {
                        var regs = await navigator.serviceWorker.getRegistrations();
                        await Promise.all(regs.map(function (r) { return r.unregister(); }));
                    }
                    if (window.caches) {
                        var nomes = await caches.keys();
                        await Promise.all(nomes.map(function (n) { return caches.delete(n); }));
                    }
                } catch (_) { /* segue para o recarregamento */ }
                location.replace(location.pathname + '?v=' + Date.now());
            });
        })();
    </script>
<!-- 🚀 [FIM: PWA - BOOT SEM FLASH (TEMA ANTES DO CSS E WATCHDOG)] -->

    <script>
        /* Service Worker.
           - SW_URL aponta para o caminho REAL do arquivo (resolvido a partir da base do
             documento), e nao para uma rota qualquer.
           - updateViaCache: none -> o navegador ignora o cache HTTP ao buscar o sw.js,
             entao uma versao nova e detectada no proximo carregamento (sem isso o cliente
             podia ficar preso em uma versao antiga para sempre).
           - Antes de registrar, confere o Content-Type: se o servidor responder HTML
             (fallback de SPA reescrevendo o caminho), avisa em vez de falhar em silencio. */
        (function () {
            if (!('serviceWorker' in navigator)) return;
            var SW_URL = new URL('sw.js', document.baseURI).href;
            var tinhaControlador = Boolean(navigator.serviceWorker.controller);
            var recarregando = false;
            function avisar(mensagem) {
                console.error('[notas-pwa] Service Worker: ' + mensagem);
                var guard = document.getElementById('bootGuard');
                var detalhe = document.getElementById('bootGuardErro');
                if (!guard || !detalhe) return;
                detalhe.textContent = mensagem;
                guard.hidden = false;
            }
            function conferirTipo() {
                return fetch(SW_URL, { cache: 'no-store' })
                    .then(function (resposta) {
                        var tipo = (resposta.headers.get('content-type') || '').toLowerCase();
                        var ok = /javascript|ecmascript/.test(tipo);
                        if (!ok) avisar('O servidor respondeu "' + tipo + '" em ' + SW_URL + ' (o Service Worker precisa ser JavaScript). Provavelmente o fallback de SPA esta reescrevendo esse caminho: mantenha o sw.js na raiz e exclua-o do fallback.');
                        return ok;
                    })
                    .catch(function () { return true; });
            }
            window.addEventListener('load', function () {
                conferirTipo().then(function (ok) {
                    if (!ok) return;
                    return navigator.serviceWorker.register(SW_URL, { scope: './', updateViaCache: 'none' })
                        .then(function (registro) {
                            console.log('[notas-pwa] Service Worker registrado em ' + SW_URL + ' (scope ' + registro.scope + ')');
                            registro.update().catch(function () { /* offline */ });
                            document.addEventListener('visibilitychange', function () {
                                if (document.visibilityState === 'visible') registro.update().catch(function () { });
                            });
                        })
                        .catch(function (erro) {
                            avisar('Falha ao registrar o Service Worker: ' + (erro && erro.message ? erro.message : erro));
                        });
                });
            });
            // Assumiu um Service Worker NOVO? Recarrega uma vez para o app usar a versao nova.
            // (O app.js também trata isso — este é o plano B caso o app não tenha iniciado.)
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (!tinhaControlador || recarregando) return;
                if (window.__notasRecarregando) return; // o app já está atualizando/recarregando
                recarregando = true;
                location.reload();
            });
        })();
    </script>
